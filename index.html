<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2631">
<title>芝加哥 × UIUC 七日交通導航</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0F3; --card:#FFFFFF; --ink:#16212B; --muted:#56636F; --rule:#D3DAE1;
  --plate:#1B2631; --plate-ink:#FFFFFF; --plate-sub:#B9C6D2;
  --bad:#B00A2A; --bad-bg:#FBE7EB; --warn:#8A5A00; --warn-bg:#FFF3D3; --ok:#0B6E38; --ok-bg:#E2F3E9;
  --accent:#0077B6; --chip:#E3E8ED;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1419; --card:#16202A; --ink:#E5ECF2; --muted:#9AA8B5; --rule:#2A3742;
    --plate:#03070A; --plate-ink:#FFFFFF; --plate-sub:#A9B8C5;
    --bad:#FF6B86; --bad-bg:#3A121B; --warn:#F2B53A; --warn-bg:#33280C; --ok:#55CE8B; --ok-bg:#0E2C1C;
    --accent:#4FC3F7; --chip:#22303C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1419; --card:#16202A; --ink:#E5ECF2; --muted:#9AA8B5; --rule:#2A3742;
  --plate:#03070A; --plate-ink:#FFFFFF; --plate-sub:#A9B8C5;
  --bad:#FF6B86; --bad-bg:#3A121B; --warn:#F2B53A; --warn-bg:#33280C; --ok:#55CE8B; --ok-bg:#0E2C1C;
  --accent:#4FC3F7; --chip:#22303C; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.55;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--plate)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.app.has-act{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
main{padding:0 14px}

/* 頂部 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--plate);color:var(--plate-ink)}
.clock b{display:block;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:22px;font-weight:600;letter-spacing:.01em;line-height:1.1}
.clock span{font-size:12px;color:var(--plate-sub)}
.lostbtn{background:#C60C30;color:#fff;border:0;border-radius:999px;padding:10px 16px;font-weight:700;min-height:44px;white-space:nowrap}
.days{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--paper);scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.dt{flex:0 0 auto;border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:6px 10px;min-height:48px;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.dt b{font-size:14px}.dt span{font-size:12px;color:var(--muted)}
.dt.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}.dt.on span{color:inherit;opacity:.8}

/* 日標題 */
.dayhead h1{font-family:"Barlow Condensed","Arial Narrow","PingFang TC",sans-serif;font-size:30px;font-weight:600;margin:6px 0 0;line-height:1.15}
.dayhead p{margin:2px 0 8px;color:var(--muted)}
.dprog,.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .25s}
.sw{margin:12px 0 4px}
.sw>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.seg{display:flex;gap:4px;background:var(--chip);border-radius:12px;padding:4px;overflow-x:auto}
.seg-b{flex:1 0 auto;border:0;background:transparent;border-radius:9px;padding:9px 10px;min-height:42px;font-size:14px;white-space:nowrap}
.seg-b.on{background:var(--card);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg-b:disabled{opacity:.5;cursor:not-allowed}

.note{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px;background:var(--chip)}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.bad{background:var(--bad-bg);color:var(--bad);font-weight:600}
.note .mini{margin-left:8px;margin-top:6px}
.fine{font-size:12.5px;color:var(--muted);margin:6px 0}
.now{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;border-left:4px solid var(--ok);padding:8px 12px;margin:10px 0;background:var(--card);border-radius:0 10px 10px 0}
.now small{color:var(--ok);font-weight:700}.now span{color:var(--muted);font-size:13px}

/* 主視覺：站牌 */
.hero{margin:14px 0 10px}
.hero-title small{display:block;color:var(--muted);font-size:13px}
.hero-title b{display:block;font-size:18px;line-height:1.35}
.hero-title span{display:block;color:var(--muted);font-size:13px;margin-bottom:8px}
.plate{background:var(--plate);color:var(--plate-ink);border-radius:12px;padding:14px 16px 16px}
.plate-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.plate-line{display:inline-block;color:#fff;font-weight:700;font-size:13px;border-radius:4px;padding:2px 8px}
.plate-count{font-size:12px;color:var(--plate-sub);margin-left:auto}
.plate-en{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:34px;font-weight:600;line-height:1.05;letter-spacing:.005em;overflow-wrap:anywhere}
.plate-zh{font-size:15px;color:var(--plate-sub);margin-top:2px}
.plate-t{font-size:16px;margin:10px 0 0;line-height:1.55}

/* 路段選擇 */
.legpick{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.lp{display:grid;grid-template-columns:30px 1fr;gap:2px 10px;text-align:left;border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:10px;min-height:52px}
.lp-n{grid-row:1/3;width:28px;height:28px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.lp-t{font-weight:600;font-size:15px}
.lp-m{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lp.on{border:2px solid var(--ink);padding:9px}
.lp.fin .lp-n{background:var(--ok);color:#fff}
.lp em{font-style:normal;font-weight:800;border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.lp em.bad{background:var(--bad)}.lp em.warn{background:var(--warn)}
.strip{display:inline-flex;gap:3px;flex-wrap:wrap}
.bul{display:inline-block;color:#fff;font-size:11.5px;font-weight:700;border-radius:4px;padding:1px 6px;line-height:1.5;white-space:nowrap}

/* 路段詳情 */
.leg{background:var(--card);border-radius:14px;padding:14px;margin:6px 0 16px;border:1px solid var(--rule)}
.ft{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:700;font-size:16px;margin-bottom:10px}
.ft .arr{color:var(--muted)}
.eta{margin:12px 0;padding:12px;border-radius:10px;background:var(--paper)}
.eta .f{display:inline-flex;align-items:center;gap:8px;margin-right:6px}
.eta-out{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px}
.eta-out small{display:block;color:var(--muted);font-size:12px}
.eta-out b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:24px;font-weight:600}
.steps{list-style:none;padding:0;margin:10px 0}
.steps li{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--rule)}
.steps li p{margin:2px 0 0;font-size:15px}
.steps li.done p,.steps li.done .sl{opacity:.55}
.steps li.cur{background:var(--warn-bg);margin:0 -8px;padding:10px 8px;border-radius:8px;border-top-color:transparent}
.chk{width:36px;height:36px;border-radius:50%;border:2px solid var(--rule);background:var(--card);font-weight:700}
.steps li.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.done.skip .chk{background:var(--muted);border-color:var(--muted)}
.steps li.cur .chk{border-color:var(--ink)}
.sl{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sl b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:19px;font-weight:600}
.sl span{color:var(--muted);font-size:13px}
.maprow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.btn{display:flex;align-items:center;justify-content:center;text-align:center;min-height:46px;padding:8px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
.addr{grid-column:1/-1;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.addr em{font-style:normal;color:var(--ok);margin-left:8px;font-weight:700}
.mini{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:6px 10px;min-height:38px;font-size:13.5px}
.mini.ghost{background:transparent}
.row-btn{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.cost{border-top:1px solid var(--rule);padding-top:10px;margin-top:6px}
.cost-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cost-g small{display:block;color:var(--muted);font-size:12px}
.cost-g b{font-size:17px}
.quote{margin-top:8px}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.f input,.f select{min-height:44px;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--card);color:var(--ink);font-size:16px;width:100%;max-width:100%}
.eta .f input{width:auto}
.more{border-top:1px solid var(--rule);padding:8px 0}
.more summary{font-weight:700;min-height:40px;display:flex;align-items:center;cursor:pointer}
.more ul{margin:4px 0;padding-left:20px}.more li{margin:4px 0;font-size:14.5px}
.more p{margin:4px 0;font-size:14.5px}

/* 時間軸 */
.sec{font-size:17px;margin:22px 0 8px}
.tl{list-style:none;margin:0;padding:0 0 0 2px;border-left:2px solid var(--rule)}
.tl li{display:grid;grid-template-columns:66px 1fr;gap:8px;padding:8px 0 8px 10px;position:relative}
.tl time{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:18px;font-weight:600;line-height:1.2}
.tl time small{display:block;font-size:14px;color:var(--muted)}
.tl-e::before{content:"";position:absolute;left:-7px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--ink)}
.tl-e.dim{opacity:.55}
.tl-h{display:flex;gap:6px;align-items:flex-start;justify-content:space-between}
.tl-e p{margin:4px 0 0;font-size:14px}
.tl-l button{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px dashed var(--rule);background:transparent;border-radius:8px;padding:6px 8px;text-align:left;font-size:13px;color:var(--muted);min-height:40px}
.badge{flex:0 0 auto;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.st-ok{background:var(--ok-bg);color:var(--ok)}
.st-pend{background:var(--warn-bg);color:var(--warn)}
.st-wait{background:repeating-linear-gradient(45deg,var(--chip),var(--chip) 4px,transparent 4px,transparent 8px);color:var(--muted);border:1px solid var(--rule)}
.st-alt{border:1px solid var(--muted);color:var(--muted)}
.st-todo{background:var(--bad-bg);color:var(--bad)}
.st-info{background:var(--chip);color:var(--muted)}
.st-self{background:var(--chip);color:var(--ink)}

/* 其他頁 */
.pg{font-family:"Barlow Condensed","Arial Narrow","PingFang TC",sans-serif;font-size:30px;font-weight:600;margin:14px 0 4px}
.lead{color:var(--muted);margin:0 0 12px;font-size:14px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;margin:8px 0;padding:0 12px}
.card summary{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:52px;cursor:pointer}
.card .right{margin-left:auto;font-size:13px;color:var(--muted)}
.card dl{margin:0 0 10px}.card dl div{padding:8px 0;border-top:1px solid var(--rule)}
.card dt{font-weight:700;font-size:13px;color:var(--muted)}.card dd{margin:2px 0 0;font-size:14.5px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.sum>div{background:var(--plate);color:var(--plate-ink);border-radius:12px;padding:12px}
.sum small{display:block;color:var(--plate-sub);font-size:12px}
.sum b{display:block;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:30px;font-weight:600;line-height:1.1}
.sum span{font-size:13px;color:var(--plate-sub)}
.setg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.setg .wide,.setg .tg,.setg .fine,.setg .note{grid-column:1/-1}
.tg{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;min-height:44px}
.tg input{width:22px;height:22px;flex:0 0 auto;margin-top:2px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin:4px 0}
.tbl td{border-top:1px solid var(--rule);padding:6px 4px;vertical-align:top}
.tbl td small{display:block;color:var(--muted)}
.tbl td:nth-child(n+2){text-align:right;white-space:nowrap}
.cl{list-style:none;padding:0;margin:8px 0}
.cl li{border-top:1px solid var(--rule)}
.cl label{display:flex;gap:12px;align-items:center;min-height:50px;font-size:15.5px}
.cl input{width:24px;height:24px;flex:0 0 auto}
.cl .x{text-decoration:line-through;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);margin:28px 0 10px}

/* 底部操作 */
.act{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--card);border-top:1px solid var(--rule);padding:8px 12px 10px}
.act-bar{height:4px;background:var(--chip);border-radius:2px;overflow:hidden;margin-bottom:8px;max-width:616px;margin-left:auto;margin-right:auto}
.act-bar i{display:block;height:100%;background:var(--ok)}
.act-row{display:grid;grid-template-columns:1fr 1fr 2fr;gap:8px;max-width:616px;margin:0 auto}
.ab{min-height:50px;border-radius:12px;border:1px solid var(--rule);background:var(--paper);font-weight:700;font-size:15px}
.ab.main{background:var(--ok);border-color:var(--ok);color:#fff}
.ab:disabled{opacity:.45}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:26;display:grid;grid-template-columns:repeat(5,1fr);background:var(--plate);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{background:transparent;border:0;color:var(--plate-sub);min-height:56px;font-size:14px;font-weight:600}
.tabs button.on{color:#fff;box-shadow:inset 0 3px 0 #00A1DE}

/* 迷路 */
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-h{display:flex;justify-content:space-between;align-items:center;font-size:20px}
.sheet h3{font-size:15px;margin:16px 0 6px}
.lostft{background:var(--paper);border-radius:10px;padding:10px;margin-top:10px}
.lostft small{display:block;color:var(--muted)}
.signs{display:flex;flex-wrap:wrap;gap:6px}
.signs span{background:var(--plate);color:#fff;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:17px;border-radius:6px;padding:4px 10px}
.phr{list-style:none;padding:0;margin:0}
.phr li{border-top:1px solid var(--rule);padding:8px 0}
.phr small{display:block;color:var(--muted)}
.phr b{font-size:17px;line-height:1.4}
.tel{list-style:none;padding:0;margin:0}
.tel li{display:flex;gap:10px;align-items:center;border-top:1px solid var(--rule);min-height:46px;flex-wrap:wrap}
.tel a{font-weight:700;color:var(--accent);min-width:150px}
.tel span{font-size:14px;color:var(--muted)}

@media (max-width:360px){ .plate-en{font-size:28px} .act-row{grid-template-columns:1fr 1fr 1.6fr} .cost-g b{font-size:15px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;scroll-behavior:auto!important} }

</style>
</head>
<body>
<div id="root"><p style="padding:20px">載入中…</p></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
/* ===== 資料：地點、活動、路段 ===== */
var LINES = {
  ATS:{c:'#6B7785',n:'ATS'}, Blue:{c:'#00A1DE',n:'Blue'}, Red:{c:'#C60C30',n:'Red'}, Green:{c:'#009B3A',n:'Green'},
  Pink:{c:'#E27EA6',n:'Pink'}, Purple:{c:'#522398',n:'Purple'}, Brown:{c:'#62361B',n:'Brown'},

var P = {

  HI:{n:'HI Chicago Hostel',a:'24 E Ida B Wells Dr, Chicago, IL 60605',en:'HI Chicago Hostel'},

  GRL:{n:'Grainger Engineering Library',a:'1301 W Springfield Ave, Urbana, IL 61801',en:'Grainger Engineering Library'},
  CSL:{n:'Coordinated Science Laboratory',a:'1308 W Main St, Urbana, IL 61801',en:'Coordinated Science Lab'},

};

var DAYS = [
  {id:1,date:'2026-11-10',md:'11/10',dow:'二',title:'抵達芝加哥＋兩場科技活動'},
  {id:2,date:'2026-11-11',md:'11/11',dow:'三',title:'Northwestern → IEEE × ACM'},
  {id:3,date:'2026-11-12',md:'11/12',dow:'四',title:'AWS Workshop → AI Meetup'},
  {id:4,date:'2026-11-13',md:'11/13',dow:'五',title:'Amtrak 南下 → UIUC → 黑客松'},

/* ===== 時間工具 ===== */
function toM(s){ if(!s) return null; var p=String(s).split(':'); return (+p[0])*60+(+p[1]); }
function fm(m){ if(m==null||isNaN(m)) return '--:--'; var d=Math.floor(m/1440); m=((Math.round(m)%1440)+1440)%1440; var t=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); return d>0? t+'（+1）' : t; }
function nowChi(){
  try{
    var parts = new Intl.DateTimeFormat('en-CA',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
    var o={}; parts.forEach(function(p){o[p.type]=p.value;});
    return {date:o.year+'-'+o.month+'-'+o.day, min:(+o.hour)*60+(+o.minute)};
  }catch(e){ var d=new Date(); return {date:'',min:d.getHours()*60+d.getMinutes()}; }
}

  }
  if(k==='amtrak'){ r.per=+S.amtFare||0; r.total=r.per*n; r.note=(leg.id==='d4-amtrak391'?(S.amt391?'已購票':'未確認購票'):(S.amt392?'已購票':'未確認購票')); return r; }
  if(k==='bus'||k==='shuttle'){ r.per=d.fare||0; r.total=r.per*n; return r; }
  if(k==='transit'){
    var per=0;
    if(d.cta){
      var covered = S.cta==='1day' || (S.cta==='3day' && leg.id.slice(0,2)!=='d6' && leg.id.slice(0,2)!=='d7');
      if(!covered) per += d.cta==='ohare'?5:(d.cta==='bus'?2.25:2.5);
      if(covered) r.note = S.cta==='3day'?'含在三日券':'含在一日券';
    }
    if(d.mtd) per += d.mtd*1;
    r.per=per; r.total=per*n; return r;
  }
  return r;
}
function dayCost(day,S){
  var legs=legsFor(day,S), sum=0, rows=[], n=Math.max(1,+S.party||3), anyCta=false;
  legs.forEach(function(l){ var k=modeOf(l,S), c=legCost(l,k,S); sum+=c.total; rows.push({leg:l,k:k,c:c}); var d=modeData(l,k); if(k==='transit'&&d&&d.cta) anyCta=true; });
  var pass=0, passNote='';
  if(S.cta==='3day' && day===1){ pass=15*n; passNote='Ventra 3-Day Ticket ×'+n; }
  if(S.cta==='1day' && anyCta){ pass=5*n; passNote='CTA 1-Day Pass ×'+n; }
  return {sum:sum+pass, rows:rows, pass:pass, passNote:passNote};
}
var usd = function(v){ return 'US$'+(Math.round(v*100)/100).toFixed(v%1===0?0:2); };
var twd = function(v,S){ return 'NT$'+Math.round(v*(+S.rate||0)).toLocaleString('en-US'); };

/* ===== 時程計算 ===== */
function plan(day,S){
  var legs=legsFor(day,S), out={}, prev=null;
  legs.forEach(function(l){
    var k=modeOf(l,S), d=modeData(l,k), dep;
    if(S.dep[l.id]) dep=toM(S.dep[l.id]);
    else if(l.start==='CLEAR') dep=toM(S.clear);
    else if(l.after!=null && prev) dep=out[prev.id].eta+l.after;
    else dep=toM(l.start);
    var extra=0;
    if(l.home) extra+=(+S.prep||0);
    if(l.lug&&S.bigLug&&(k==='transit'||k==='walk')) extra+=10;
    if(l.lug&&S.bigLug&&(k==='uberx'||k==='uberxl')) extra+=5;
    var eta;
    if(l.train&&k==='amtrak'){ dep=toM(l.fixed); eta=toM(l.arr); if(eta<dep) eta+=1440; }
    else eta=dep+extra+(d?d.min:0);
    out[l.id]={dep:dep,eta:eta,extra:extra,k:k,min:d?d.min:0};
    prev=l;
  });
  return {legs:legs,t:out};
}
function status(l,t){
  if(l.tour || (!l.by && !l.hard)) return null;
  var by=toM(l.by||l.hard), diff=by-t.eta;
  if(l.hard && t.eta>toM(l.hard)) return {lv:'bad',txt:'會趕不上（最晚 '+l.hard+'）'};
  if(diff<0) return {lv:'bad',txt:'比你設定的目標抵達時間 '+l.by+' 晚 '+(-diff)+' 分鐘'};
  if(diff<10) return {lv:'warn',txt:'比你設定的目標抵達時間 '+l.by+' 只早 '+diff+' 分鐘，緩衝很少'};
  return {lv:'ok',txt:'比你設定的目標抵達時間 '+l.by+' 早 '+diff+' 分鐘'};
}

      ${S.tab==='chk'?html`<${Checks} S=${S} set=${set}/>`:null}
      ${S.tab==='set'?html`<${Settings} S=${S} set=${set}/>`:null}
      <p className="foot">資料查證：CTA、O’Hare（flychicago.com）、Amtrak 時刻表、MTD、Peoria Charter、各活動頁與原行程表。查證日期 2026-11-10。Blue Line 11/13 22:00–11/16 04:00 Jefferson Park–Harlem 改接駁巴士（CTA 公告）。所有時間為芝加哥時間。</p>
    </main>
    ${S.tab==='nav'&&active?html`<div className="act" role="region" aria-label="步驟操作">
      <div className="act-bar"><i style=${{width:(steps.length?done/steps.length*100:0)+'%'}}></i></div>
      <div className="act-row">
        <button className="ab ghost" disabled=${done<=0} onClick=${function(){step(-1);}}>上一步</button>
        <button className="ab ghost" disabled=${done>=steps.length} onClick=${function(){step(1,true);}}>跳過</button>
        <button className="ab main" disabled=${done>=steps.length} onClick=${function(){step(1);}}>${done>=steps.length?'本段完成':('完成第 '+(done+1)+' 步')}</button>
      </div>
    </div>`:null}
    <nav className="tabs" aria-label="功能">${tabs.map(function(t){ return html`<button key=${t[0]} aria-current=${S.tab===t[0]?'page':undefined} className=${S.tab===t[0]?'on':''} onClick=${function(){set({tab:t[0]}); window.scrollTo(0,0);}}>${t[1]}</button>`; })}</nav>
    ${lost?html`<${Lost} S=${S} leg=${active} close=${function(){setLost(false);}}/>`:null}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);

</script>
</body>
</html>
